name: openrouter-mobile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 128mb
    networks:
      - openrouter-mobile

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-openrouter}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-openrouter}
    volumes:
      - miniodata:/data
    networks:
      - openrouter-mobile
  # User code still has CPU/disk up to the quotas below; this is not gVisor/Kata.
  sandbox:
    image: ghcr.io/brofrong/python-mcp-sandbox:sha256-f9de48d74ff93146c5278f6e2aef9e42444a9aa05212bbcac2b4f674998e748c
    pull_policy: always
    container_name: sandbox
    user: "1000:1000"
    init: true
    privileged: false
    read_only: true
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Host-only. Do not bind 0.0.0.0 — that publishes the jail on the LAN.
      - "127.0.0.1:${SANDBOX_PORT:-8090}:8090"
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET:?set SANDBOX_SECRET in .env}
      SANDBOX_DATA: /data
      SANDBOX_REQUIRE_ISOLATION: "1"
      SANDBOX_MAX_KERNELS: ${SANDBOX_MAX_KERNELS:-32}
      SANDBOX_IDLE_KERNEL_SECONDS: ${SANDBOX_IDLE_KERNEL_SECONDS:-900}
      SANDBOX_IDLE_WORKSPACE_SECONDS: ${SANDBOX_IDLE_WORKSPACE_SECONDS:-900}
      SANDBOX_MAX_WORKSPACE_BYTES: ${SANDBOX_MAX_WORKSPACE_BYTES:-209715200}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-536870912}
      SANDBOX_CPU_SECONDS: ${SANDBOX_CPU_SECONDS:-30}
    volumes:
      - sandbox-data:/data
    tmpfs:
      - /tmp:size=64M,mode=1777,nosuid,nodev,noexec
      - /home/sandbox:size=16M,uid=1000,gid=1000,mode=0755,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # gpt flavor needs more: SANDBOX_MEM_LIMIT=8g SANDBOX_MEMORY_BYTES=2147483648
    mem_limit: ${SANDBOX_MEM_LIMIT:-4g}
    cpus: "2.0"
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    networks:
      - openrouter-mobile

  duckduckgo:
    image: mcp/duckduckgo
    restart: unless-stopped
    logging: *default-logging
    command:
      - python
      - -m
      - duckduckgo_mcp_server.server
      - --transport
      - streamable-http
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      DDG_ALLOWED_HOSTS: duckduckgo:*,localhost:*,127.0.0.1:*
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - openrouter-mobile

  server:
    image: ghcr.io/brofrong/openrouter-mobile/server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-openrouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openrouter}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env (https://$DOMAIN)}
      WEB_DIR: ${WEB_DIR:-/app/web}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-openrouter}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-openrouter}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox:8090}
      SANDBOX_SECRET: ${SANDBOX_SECRET:-openrouter-sandbox}
      MCP_URL: ${MCP_URL:-http://duckduckgo:8000/mcp}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      sandbox:
        condition: service_started
      duckduckgo:
        condition: service_started
    # expose:
    #   - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/auth/ok').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - proxy
      - openrouter-mobile

volumes:
  pgdata:
  miniodata:
  sandbox-data:
  caddy_data:
  caddy_config:

networks:
  openrouter-mobile:
    driver: bridge
  proxy:
    external: true
