name: openrouter-mobile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 128mb
    networks:
      - openrouter-mobile

  server:
    image: ghcr.io/brofrong/openrouter-mobile/server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-openrouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openrouter}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env (https://$DOMAIN)}
      WEB_DIR: ${WEB_DIR:-/app/web}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    # expose:
    #   - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/auth/ok').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - proxy
      - openrouter-mobile

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  openrouter-mobile:
    driver: bridge
  proxy:
    external: true
